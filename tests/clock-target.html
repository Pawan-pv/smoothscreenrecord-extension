<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmoothStudio Clock Target</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #05070D; color: #F8FAFC; font-family: 'Courier New', monospace; }
    /* Machine readable locator: a magenta square pinned to the page origin.
       A test that captures the whole screen locates this square to find the
       exact page origin inside the captured frame. */
    #locator { position: fixed; left: 0; top: 0; width: 40px; height: 40px; background: #FF00FF; z-index: 99999; }
    /* Binary clock strip: 24 contiguous 26x26 blocks at (0, 60).
       Block i encodes bit (23-i) of floor(performance.now()) - MSB first.
       White (#FFFFFF) = 1, Black (#000000) = 0. */
    #binary-clock { position: fixed; left: 0; top: 60px; width: 624px; height: 26px; z-index: 99998; }
    #binary-clock .bit { position: absolute; top: 0; width: 26px; height: 26px; }
    /* Click counter strip: 8 blocks at (0, 100) encoding the number of button presses. */
    #click-strip { position: fixed; left: 0; top: 100px; width: 208px; height: 26px; z-index: 99998; }
    #click-strip .bit { position: absolute; top: 0; width: 26px; height: 26px; }
    .panel { margin: 150px 40px 0 40px; }
    .digit { font-size: 64px; font-weight: bold; color: #38BDF8; letter-spacing: 2px; }
    .sub { font-size: 24px; color: #94A3B8; margin-top: 8px; }
    .frame { font-size: 24px; color: #4ADE80; margin-top: 8px; }
    .box { margin-top: 20px; width: 460px; height: 150px; background: #0F172A; border: 2px solid #8B5CF6; border-radius: 12px; padding: 16px; }
    .box h2 { margin: 0 0 8px 0; font-size: 20px; }
    .box p { margin: 4px 0; font-size: 15px; color: #CBD5E1; }
    #target-btn { margin-top: 12px; background: #8B5CF6; color: white; border: none; border-radius: 8px; padding: 10px 22px; font-size: 18px; cursor: pointer; }
    /* Big visual state marker: turns solid green on every press. */
    #press-marker { margin-top: 14px; width: 120px; height: 60px; background: #111827; border: 3px solid #374151; border-radius: 8px; }
    #press-marker.pressed { background: #00FF00; border-color: #00FF00; }
  </style>
</head>
<body>
  <div id="locator"></div>
  <div id="binary-clock"></div>
  <div id="click-strip"></div>

  <div class="panel">
    <div class="digit" id="clock-text">0.0 ms</div>
    <div class="sub">SmoothStudio Clock Target &mdash; page performance.now() rendered into video</div>
    <div class="frame" id="frame-text">Frame: 0</div>

    <div class="box">
      <h2>Clock Target App</h2>
      <p id="status">Idle. Press the button (each press flips the green marker).</p>
      <button id="target-btn">Press Me</button>
      <div id="press-marker"></div>
    </div>
  </div>

  <script>
    (function () {
      const CLOCK_BITS = 24;
      const CLICK_BITS = 8;
      const BLOCK = 26;

      function buildStrip(id, bits) {
        const strip = document.getElementById(id);
        const blocks = [];
        for (let i = 0; i < bits; i++) {
          const d = document.createElement('div');
          d.className = 'bit';
          d.style.left = (i * BLOCK) + 'px';
          d.style.background = '#000000';
          strip.appendChild(d);
          blocks.push(d);
        }
        return blocks;
      }

      const clockBlocks = buildStrip('binary-clock', CLOCK_BITS);
      const clickBlocks = buildStrip('click-strip', CLICK_BITS);

      const clockText = document.getElementById('clock-text');
      const frameText = document.getElementById('frame-text');
      const marker = document.getElementById('press-marker');
      let frameCount = 0;
      let presses = 0;

      function writeBits(blocks, value, bits) {
        for (let i = 0; i < bits; i++) {
          const bit = (value >> (bits - 1 - i)) & 1;
          blocks[i].style.background = bit ? '#FFFFFF' : '#000000';
        }
      }

      function paint() {
        const now = performance.now();
        writeBits(clockBlocks, Math.floor(now), CLOCK_BITS);
        writeBits(clickBlocks, presses % 256, CLICK_BITS);
        clockText.textContent = now.toFixed(1) + ' ms';
        frameCount++;
        frameText.textContent = 'Frame: ' + frameCount;
      }

      document.getElementById('target-btn').addEventListener('click', () => {
        presses++;
        document.getElementById('status').textContent = 'Pressed #' + presses + ' at ' + performance.now().toFixed(1) + ' ms';
        marker.classList.add('pressed');
        paint();
      });

      paint();
      // The clock page is intentionally animated: it is the F3 timebase fixture.
      setInterval(paint, 50);
    })();
  </script>
</body>
</html>
