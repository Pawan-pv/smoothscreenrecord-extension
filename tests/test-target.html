<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366F1">
  <title>SmoothStudio Autonomous Test Target App</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0F172A;
      color: #F8FAFC;
      margin: 0;
      padding: 40px;
    }
    .card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      max-width: 600px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .btn {
      background: #8B5CF6;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 12px;
      transition: background 0.2s;
    }
    .btn:hover { background: #7C3AED; }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      background: #0F172A;
      border: 1px solid #475569;
      border-radius: 6px;
      color: white;
      margin-top: 8px;
      box-sizing: border-box;
    }
    .sensitive-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px dashed #EF4444;
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <h1>SmoothStudio Live Automation Fixture</h1>
  <p>This page tests DOM tracking, mouse spline ingestion, and PII redaction.</p>

  <div class="card" id="main-demo-card">
    <h2>Cloud Infrastructure Controls</h2>
    <p>Logged in as: <span id="user-email">ceo@enterprise-saas.com</span></p>
    <p>Monthly Recurring Revenue: <span id="user-revenue">$1,450,000 USD</span></p>

    <div class="sensitive-box">
      <strong>Secret API Token:</strong>
      <div id="user-api-key">sk&#95;live_998877665544332211aabbccddeeff</div>
    </div>

    <div style="margin-top: 20px;">
      <label for="feature-input">Deploy Feature Branch:</label>
      <input type="text" id="feature-input" placeholder="Type branch name (e.g. feat/spring-camera)..." />
    </div>

    <div style="margin-top: 24px;">
      <button class="btn" id="btn-deploy">Deploy to Production</button>
      <button class="btn" id="btn-rollback" style="background: #334155;">Rollback</button>
    </div>

    <div id="status-log" style="margin-top: 16px; color: #10B981; font-weight: 500;"></div>
  </div>

  <script>
    document.getElementById('btn-deploy').addEventListener('click', () => {
      document.getElementById('status-log').innerText = 'Deployment initiated at ' + new Date().toLocaleTimeString();
    });
    document.getElementById('btn-rollback').addEventListener('click', () => {
      document.getElementById('status-log').innerText = 'Rollback completed.';
    });
  </script>
</body>
</html>
